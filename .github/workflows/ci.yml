name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar archivos principales
        run: |
          test -f index.html
          test -f styles.css
          test -f main.js
          test -f README.md
          test -f LICENSE
      - name: Verificar HTML basico
        run: |
          grep -q "<title>" index.html
          grep -q "<html" index.html
